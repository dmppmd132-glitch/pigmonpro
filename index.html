<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豬豬小可愛*粉紅</title>
<script>addEventListener('error',function(e){var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;top:0;margin:0;padding:8px;background:#fff;color:#c00;font-size:12px;white-space:pre-wrap;z-index:99';d.textContent='載入錯誤：'+(e.message||'')+' (行 '+(e.lineno||'?')+')';(document.body||document.documentElement).appendChild(d)})</script>
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="shell">
<noscript>此頁面需要啟用 JavaScript 才能遊玩。</noscript>
<canvas id="c" width="480" height="432"></canvas>
<div id="pad">
<div class="dp"><button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button><i></i><button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button></div>
<div class="ab"><button data-k="x">X</button><button data-k="y">Y</button><button data-k="b">B</button><button data-k="a">A</button></div>
</div></div>
<p>方向鍵／WASD 移動　Z／空白鍵／Enter＝A（確認）　X＝選單　B＝取消／退出特殊地形　Y＝地圖　M＝音樂開關</p>
<button id="mu" style="background:var(--btn);color:#fff;border:0;border-radius:14px;padding:6px 14px;font-size:13px"></button>
<script src="js/maps/layouts.js" defer></script>
<script src="js/creatures/catalog.js" defer></script>
<script src="js/game.js" defer></script></body></html>
